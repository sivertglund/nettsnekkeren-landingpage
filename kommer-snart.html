<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kommer snart — Nettsnekkeren</title>
  <meta name="description" content="Denne tjenesten kommer snart. Ta kontakt om du vil høre mer." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23000'/%3E%3Ctext x='50' y='70' font-size='64' font-family='Oswald,sans-serif' font-weight='700' fill='%23fff' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E" />
</head>
<body class="subpage subpage--center">
  <div class="starfield" aria-hidden="true"></div>

  <header class="nav nav--solid">
    <a href="index.html" class="logo">Nettsnekkeren</a>
    <div class="nav__right">
      <a href="index.html" class="nav__talk">← Tilbake</a>
    </div>
  </header>

  <main class="coming">
    <div class="container">
      <span class="subhero__eyebrow" data-reveal id="comingTag">Tjeneste</span>
      <h1 class="display coming__title" data-reveal><span id="comingService">Tjenesten</span><br /><span class="outline">KOMMER SNART</span></h1>
      <p class="coming__lead" data-reveal>
        Vi jobber med saken. Vil du være først ute når den lanseres — eller
        snakke med oss allerede nå? Ta kontakt.
      </p>
      <div class="subhero__cta" data-reveal>
        <a href="mailto:post@nettsnekkeren.no" class="btn btn--solid">post@nettsnekkeren.no <span>↗</span></a>
        <a href="index.html#tjenester" class="btn btn--ghost">Se alle tjenester</a>
      </div>
    </div>
  </main>

  <footer class="footer footer--page">
    <div class="container footer__row">
      <a href="index.html" class="footer__logo">NETTSNEKKEREN</a>
      <span>© 2026 — Vi bygger fra bunnen</span>
    </div>
  </footer>

  <script>
    // show the requested service name
    (function () {
      var t = new URLSearchParams(location.search).get("t");
      if (t) {
        var s = decodeURIComponent(t);
        document.getElementById("comingService").textContent = s;
        document.getElementById("comingTag").textContent = "TJENESTE — " + s.toUpperCase();
        document.title = s + " — kommer snart — Nettsnekkeren";
      }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/page.js"></script>
</body>
</html>
